name: Release CLI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo build --workspace --release --locked --target "${{ matrix.target }}"
      - name: Package binary
        run: tar -C "target/${{ matrix.target }}/release" -czf "snappydiff-${{ matrix.target }}.tar.gz" snappydiff
      - uses: actions/upload-artifact@v4
        with:
          name: snappydiff-${{ matrix.target }}
          path: snappydiff-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: snappydiff-*
          merge-multiple: true
      - name: Create checksums
        run: sha256sum snappydiff-*.tar.gz > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" snappydiff-*.tar.gz checksums.txt --verify-tag --generate-notes
