<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>SnappyDiff</title>
    <style>
      :root { font-family: ui-sans-serif, system-ui, sans-serif; color: #eef2ff; background: #090b12; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(36rem, calc(100% - 3rem)); }
      h1 { font-size: clamp(2.5rem, 8vw, 5rem); letter-spacing: -0.06em; margin: 0; }
      p { color: #a8b0c7; line-height: 1.6; }
      a { color: #9ca9ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>SnappyDiff</h1>
      <p>Private screenshot review for CI. Sign in to inspect your organization’s projects and visual changes.</p>
      <a href="/auth/login">Sign in with WorkOS</a>
    </main>
  </body>
</html>
