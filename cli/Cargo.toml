[package]
name = "snappydiff"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Upload deterministic screenshot manifests to SnappyDiff"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["fs", "macros", "rt-multi-thread", "time"] }
walkdir = "2.5"
